<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c56d"/>
      <stop offset="100%" stop-color="#0f7a47"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="#0d4e32"/>

  <!-- menara kiri & kanan -->
  <rect x="16" y="52" width="9" height="30" fill="#eafff3"/>
  <polygon points="16,52 20.5,42 25,52" fill="url(#gold)"/>
  <rect x="75" y="52" width="9" height="30" fill="#eafff3"/>
  <polygon points="75,52 79.5,42 84,52" fill="url(#gold)"/>

  <!-- badan bangunan -->
  <rect x="30" y="58" width="40" height="24" fill="#eafff3"/>
  <path d="M30 58 a20 20 0 0 1 40 0 z" fill="url(#dome)"/>

  <!-- pintu -->
  <path d="M45 82 v-14 a5 5 0 0 1 10 0 v14 z" fill="#0d4e32"/>

  <!-- puncak kubah & bulan sabit -->
  <circle cx="50" cy="34" r="3" fill="url(#gold)"/>
  <path d="M50 20 c-3 3 -3 8 0 11 c-4 -1 -7 -5 -6 -9 c1 -3 4 -4 6 -2 z" fill="url(#gold)"/>
</svg>
