<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mushalla Al Amanah</title>
    <!--
      Trik redirect SPA untuk GitHub Pages (project page), supaya link langsung
      seperti /tentang atau /auth/callback?... (mis. dari email konfirmasi Supabase)
      tetap bisa dibuka walau GitHub Pages tidak tahu route tsb.
      Referensi: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // project page: /<nama-repo>/...
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
